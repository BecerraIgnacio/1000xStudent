<title>Oral Tema</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
/* Same visual language as the study videos: paper ground, white nodes, blue for the current block, orange when over time. Light-only on purpose. */
:root {
  --bg: #F4F2ED;
  --card: #FFFFFF;
  --ink: #1A1D23;
  --muted: #5B6170;
  --line: #D9D5CC;
  --accent: #2340C4;
  --accent-soft: #E3E8FB;
  --warm: #B4441A;
  --warm-soft: #FBE6DC;
  --mark: rgba(255, 205, 0, 0.55);
  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 22px 150px; display: flex; flex-direction: column; gap: 22px; }
.topline { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
.topline b { color: var(--ink); }
.hint { margin: 0; color: var(--muted); max-width: 62ch; }

.map { display: flex; flex-direction: column; align-items: center; }
.root { background: var(--ink); color: #FFFFFF; border-radius: 18px; padding: 16px 28px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.root h1 { margin: 0; font-size: clamp(26px, 5vw, 40px); font-weight: 800; line-height: 1.1; text-wrap: balance; }
.root span { font-size: 14px; opacity: 0.8; font-variant-numeric: tabular-nums; }
.stem { width: 4px; height: 24px; background: var(--line); }
.nodes { width: 100%; border-top: 4px solid var(--line); padding-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; counter-reset: n; }
.node { background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; scroll-margin: 90px 0 160px; }
.node.now { border-color: var(--accent); background: var(--accent-soft); }
.node.past { opacity: 0.55; }
.node header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.node h2 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; }
.node h2::before { counter-increment: n; content: counter(n) "  "; color: var(--accent); }
.node.edge h2::before { content: ""; }
.time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.keys span { background: linear-gradient(var(--mark), var(--mark)); border-radius: 6px; padding: 2px 8px; font-size: 15px; font-weight: 600; }
details summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--accent); }
details p { margin: 8px 0 0; font-size: 15px; line-height: 1.55; }
summary:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.timer .in { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.bar { display: flex; gap: 4px; }
.bar span { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.clock { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.clock small { font-size: 15px; font-weight: 600; color: var(--muted); }
.status { font-size: 14px; color: var(--muted); flex: 1; min-width: 140px; }
.status.over { color: var(--warm); font-weight: 700; }
.timer button { font: 700 16px var(--font); border-radius: 12px; padding: 10px 18px; cursor: pointer; border: 3px solid var(--accent); background: var(--accent); color: #FFFFFF; min-height: 46px; }
.timer button.ghost { background: var(--accent-soft); color: var(--accent); }
</style>

<!-- Datos del oral: los genera armar-mapa.mjs a partir del script. -->
<script type="application/json" id="oral">
{"tema": "Tema", "minutos": 1, "wpm": 150, "bloques": [
 {"titulo": "Apertura", "palabras": 50, "desde": 0, "hasta": 20, "claves": ["idea central"], "texto": "Texto de ejemplo."},
 {"titulo": "Desarrollo", "palabras": 75, "desde": 20, "hasta": 50, "claves": ["concepto", "ejemplo"], "texto": "Texto de ejemplo."},
 {"titulo": "Cierre", "palabras": 25, "desde": 50, "hasta": 60, "claves": ["síntesis"], "texto": "Texto de ejemplo."}
]}
</script>

<div class="wrap">
  <div class="topline"><span><b>Oral</b> · mapa para practicar</span><span id="meta"></span></div>
  <p class="hint">Practicá mirando solo las palabras clave. Tocá <b>Empezar</b>: el bloque en el que deberías estar se marca en azul.</p>
  <div class="map">
    <div class="root"><h1 id="tema"></h1><span id="dur"></span></div>
    <div class="stem"></div>
    <div class="nodes" id="nodes"></div>
  </div>
</div>

<div class="timer">
  <div class="in">
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="row">
      <div class="clock" id="clock" aria-live="off">0:00 <small></small></div>
      <div class="status" id="status" aria-live="polite">Listo para empezar</div>
      <button id="go" type="button">Empezar</button>
      <button id="reset" class="ghost" type="button">Reiniciar</button>
    </div>
  </div>
</div>

<script>
(() => {
  const data = JSON.parse(document.getElementById("oral").textContent);
  const total = data.bloques.at(-1).hasta;
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  const palabras = data.bloques.reduce((n, b) => n + b.palabras, 0);

  $("tema").textContent = data.tema;
  $("dur").textContent = data.minutos + " min · " + palabras + " palabras";
  $("meta").textContent = data.wpm + " palabras por minuto";
  $("clock").lastElementChild.textContent = "/ " + mmss(total);

  const edge = (t) => /^(apertura|cierre)$/i.test(t);
  const nodes = data.bloques.map((b) => {
    const n = el("article", "node" + (edge(b.titulo) ? " edge" : ""));
    const h = el("header");
    h.append(el("h2", null, b.titulo), el("span", "time", mmss(b.desde) + "–" + mmss(b.hasta)));
    const k = el("div", "keys");
    b.claves.forEach((c) => k.append(el("span", null, c)));
    const d = el("details");
    d.append(el("summary", null, "Ver texto"), el("p", null, b.texto));
    n.append(h, k, d);
    $("nodes").append(n);
    return n;
  });
  const fills = data.bloques.map((b) => {
    const s = el("span"); s.style.flex = String(Math.max(1, b.hasta - b.desde));
    const i = el("i"); s.append(i); $("bar").append(s);
    return i;
  });

  let elapsed = 0, startedAt = null, tick = null, lastNow = -1;
  const reduce = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;

  const paint = () => {
    const t = elapsed + (startedAt ? (performance.now() - startedAt) / 1000 : 0);
    $("clock").firstChild.textContent = mmss(t) + " ";
    let now = data.bloques.findIndex((b) => t < b.hasta);
    if (now === -1) now = data.bloques.length;
    nodes.forEach((n, i) => { n.classList.toggle("now", i === now && (startedAt || elapsed > 0)); n.classList.toggle("past", i < now); });
    fills.forEach((f, i) => { const b = data.bloques[i]; f.style.width = Math.min(100, Math.max(0, ((t - b.desde) / Math.max(1, b.hasta - b.desde)) * 100)) + "%"; });
    const st = $("status");
    if (t > total) { st.textContent = "Te pasaste " + mmss(t - total); st.classList.add("over"); }
    else if (t === 0) { st.textContent = "Listo para empezar"; st.classList.remove("over"); }
    else { st.textContent = "Ahora: " + data.bloques[now].titulo; st.classList.remove("over"); }
    if (now !== lastNow && now < nodes.length && startedAt) {
      nodes[now].scrollIntoView?.({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
      lastNow = now;
    }
  };

  $("go").onclick = () => {
    if (startedAt) {
      elapsed += (performance.now() - startedAt) / 1000; startedAt = null;
      clearInterval(tick); $("go").textContent = "Seguir";
    } else {
      startedAt = performance.now(); tick = setInterval(paint, 250); $("go").textContent = "Pausa";
    }
    paint();
  };
  $("reset").onclick = () => { clearInterval(tick); elapsed = 0; startedAt = null; lastNow = -1; $("go").textContent = "Empezar"; paint(); };
  paint();
})();
</script>
